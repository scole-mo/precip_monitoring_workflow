meta=housekeep

[prune]
# --------------------------------------------------------------------------
# Cylc workflow logs and task work directories
# --------------------------------------------------------------------------
# Keep 7 days of scheduler/task logs
prune-logs-at=-P7D
prune-remote-logs-at=-P7D
# Remove task work directories after 2 days
prune-work-at=-P2D

# --------------------------------------------------------------------------
# Raw forecast pp files
# Safe to remove once process_periods / process_analysis have run
# --------------------------------------------------------------------------
fcst-pp-6hr[$DATADIR/6_hour/%Y%m%dT%H%MZ_*.pp]=-P2D
fcst-pp-24hr[$DATADIR/24_hour/%Y%m%dT%H%MZ_*.pp]=-P2D

# --------------------------------------------------------------------------
# Processed forecast accumulation nc files
# run_series_analysis_agg needs up to 30 days back -> keep 31 days
# --------------------------------------------------------------------------
processed-fcst-nc[$PROCESSED_DIR/VT%Y%m%dT%H%MZ_*_accums.nc]=-P31D

# --------------------------------------------------------------------------
# GPM obs accumulation nc files
# run_series_analysis_agg reads these across the full agg window -> keep 31 days
# Files are named by valid time using YYYYMMDDHH (no T/Z separator)
# --------------------------------------------------------------------------
gpm-nc-6hr[$PROCESSED_DIR/6_hour_gpm/gpm_*_%Y%m%d%H.nc]=-P31D
gpm-nc-24hr[$PROCESSED_DIR/24_hour_gpm/gpm_*_%Y%m%d%H.nc]=-P31D

# --------------------------------------------------------------------------
# MET series analysis output
# Organised as one subdirectory per cycle point.
# run_verpy_plotting and run_verpy_plotting_agg read from the current cycle's
# output only, so 7 days is ample (covers retries/delays).
# --------------------------------------------------------------------------
met-output[$MET_OUTPUT_DIR/%Y%m%dT%H%MZ]=-P7D
