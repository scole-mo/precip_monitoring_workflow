[command]
# AGGREGATED and VALID_START are only set (by run_verpy_plotting_agg's
# pre-script in flow.cylc) when this shared app is run as the aggregated
# (e.g. 24hr 7-day) plotting task; they're left unset for the plain
# per-cycle plotting task, so these expansions are empty there.
default=verpy-run python $ROSE_SUITE_DIR/app/run_verpy_plotting/bin/verpy_plotting_precip_monitoring_agg.py --vdate $CYLC_TASK_CYCLE_POINT --fcrs $LEAD_SEQ --met-source $MET_SOURCE --outdir $OUTDIR --truth-type $TRUTH --accumulation $ACCUM_PERIOD --model $MODEL ${PSUITE_ID:+--psuite-id $PSUITE_ID} ${AGGREGATED:+--aggregated} ${VALID_START:+--start-vdate $VALID_START}

[env]
# Environment variables are already set in flow.cylc