/*
This provides the functionality of the VerPy plot output webpage, allowing
the user to select images using the PageUp and PageDown keys and to resize
the selected image.

svn $Id: plotdisplay.js 616 2017-06-22 07:27:26Z clarebysouth $
svn $URL: https://code.metoffice.gov.uk/svn/ver/verpy/branches/dev/clarebysouth/r4416_749_METNetCDF/VerPy/web/plotdisplay.js $
*/


$(document).ready(function(){
    // Have a short delay to allow the first image's size to be known
    setTimeout(run_image_display, 60);
});

function run_image_display(){

    var image_scales = [0.6, 0.7, 0.9];
    var scale = 0.7;

    // Setup an array of all numbers
    var VerPy_images     = [];
    var VerPy_chosenplot = 0;
    $("a.plot_link").each(function(){
        VerPy_images.push($(this).attr("href"));
    });

    // Highlights the button of the chosen plot and updates title
    function VerPy_highlightselected(){

        var selected_div;
        $("div.plot_surround").each(function(){
            var child_link = $(this).children("a.plot_link:first")
            if ($("#VerPy_image").attr("src") == child_link.attr("href")){
                VerPy_chosenplot = child_link.attr("href");
                $("#VerPy_image")
                    .attr("nativeheight", child_link.attr("nativeheight"))
                    .height(child_link.attr("nativeheight") * scale);
                selected_div = $(this);
                child_link.css('font-weight', 'bold');
                $(this).removeClass("plot_unselected")
                       .addClass("plot_selected");
            }else{
                child_link.css('font-weight', 'normal');
                $(this).removeClass("plot_selected plot_unselected")
                       .addClass("plot_unselected");
            }
        });
        $('span#image_name').text(VerPy_chosenplot);

        // Collapse non-required subjobs
        $("div.plot_section").each(function(){
            var title_div = $('div#'+$(this).attr('id')+'_title');
            if ($(this).children("div.plot_selected").length > 0){
                title_div.removeClass("plot_unselected")
                         .addClass("plot_selected");
                $(this).slideDown('fast');
            }else{
                $(this).slideUp('fast');
                title_div.removeClass("plot_selected plot_unselected")
                         .addClass("plot_unselected");
            }
        });
    }

    // The actual linked numbers do nothing
    $("a.plot_link").click(function(e){
        e.preventDefault();
    });

    // React to clicking the box around the link for ease
    $("div.plot_surround").click(function(e){
        var plots;
        if ($(this).hasClass('plot_subjob')){
            plots = $(this).nextAll('div.plot_section');
        }else{
            plots = $(this);
        }
        $("#VerPy_image").attr("src",
            plots.find("a.plot_link:first").attr("href"));
        VerPy_highlightselected();
    });

    //PageUp and PageDown scrolling through plots
    $(document).keydown(function(e){
        if(e.keyCode == 33){
            for (var i in VerPy_images) {
                if (VerPy_images[i] == VerPy_chosenplot) {
                    if (i != 0){
                        VerPy_chosenplot = VerPy_images[i-1];
                        $('#VerPy_image').attr('src',VerPy_chosenplot);
                        VerPy_highlightselected();
                        return false;
                    }
                }
            }
            return false;
        }
        else if(e.keyCode == 34){
            for (var i in VerPy_images) {
                if (VerPy_images[i] == VerPy_chosenplot) {
                    if (i != VerPy_images.length-1){
                        VerPy_chosenplot = VerPy_images[(i-1)+2];
                        $('#VerPy_image').attr('src',VerPy_chosenplot);
                        VerPy_highlightselected();
                        return false;
                    }
                }
            }
            return false;
        }
    });

    // Goes to the original plot
    $("div#view_plot").click(function(e){
        e.preventDefault();
        document.location.href = VerPy_chosenplot;
    });

    // Set-up initial plot
    $('#VerPy_image').height($('#VerPy_image').height() * scale)
                     .attr('nativeheight',
                           $('a.plot_link:first').attr('nativeheight'));

    // Functions for registering 'small', 'medium' and 'large' button clicks
    $("div#zoom_small").click(function(e){
        e.preventDefault();
        scale = image_scales[0];
        set_image_height($(this));
    });
    $("div#zoom_medium").click(function(e){
        e.preventDefault();
        scale = image_scales[1];
        set_image_height($(this));
    });
    $("div#zoom_large").click(function(e){
        e.preventDefault();
        scale = image_scales[2];
        set_image_height($(this));
    });

    // Changes the size of the plot and highlights the given button
    function set_image_height(highlight_button){
        var new_height = $("#VerPy_image").attr("nativeheight") * scale;
        $("#VerPy_image").animate({"height":new_height+"px"});
        $("div.zoom_button")
            .removeClass("plot_selected")
            .addClass("plot_unselected");
        highlight_button
            .removeClass("plot_unselected")
            .addClass("plot_selected");
    }

    VerPy_highlightselected();

}

    </script>
